descriptor-schema-version: "2.9"

info:
  name: lo1_recovery
  description: Receives IOS XE syslog and re-enables Loopback1 through Netmiko
  version: "1.0"
  author-name: CCNPAUTO
  author-link: https://developer.cisco.com/

app:
  type: docker
  cpuarch: x86_64
  resources:
    profile: custom
    cpu: 100
    memory: 256
    disk: 10
    network:
      - interface-name: eth0
        description: Receives IOS XE syslog over UDP
        ports:
          udp:
            - 5514
  startup:
    rootfs: rootfs.tar
    target:
      - python3
      - /app/loopback_recovery.py
